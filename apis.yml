- aid: datahub:datahub-entities-api
  name: DataHub Entities API
  description: >-
    Read, write, and delete metadata entities in the DataHub metadata graph. The entities endpoints support
    upserting entity-aspect pairs, retrieving the latest aspects for a given entity, and performing soft
    or hard deletes on entities.
  humanURL: https://docs.datahub.com/docs/api/graphql/overview
  baseURL: http://localhost:8080/api/graphql
