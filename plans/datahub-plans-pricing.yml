specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: DataHub
providerId: datahub
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Data Catalog
  - Data Discovery
  - Data Governance
  - Data Lineage
  - Open Source
  - Metadata
description: DataHub is offered in two forms. DataHub Core is the Apache 2.0 open-source data
  catalog originally created at LinkedIn — free to download, run, and modify; the cost is the
  underlying infrastructure (Kafka, Elasticsearch, MySQL/Postgres) and operator effort. DataHub
  Cloud is the commercial managed service from Acryl Data (now branded under datahub.com). DataHub
  Cloud is sold via demo / sales engagement; the company does not publish a numeric price list on
  the public site.
sources:
  - https://datahub.com/
  - https://datahub.com/products/cloud-vs-core/
  - https://github.com/datahub-project/datahub
notes: DataHub Cloud pricing is gated behind a demo request — no public per-seat or per-asset
  prices. DataHub Core is free and open source.
plans:
  - id: datahub-core
    name: DataHub Core
    type: freemium
    description: Apache 2.0 open-source data catalog. Free to use; operators bear the underlying
      infrastructure cost.
    entries:
      - label: Software license
        name: license
        type: flat
        metric: month
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Apache 2.0 license
      - name: Search and discovery features
      - name: GraphQL, OpenAPI, REST APIs
      - name: Python and Java SDKs
      - name: Actions Framework
      - name: Community Slack and GitHub support
  - id: datahub-cloud
    name: DataHub Cloud
    type: enterprise
    description: Managed enterprise service. SLA-backed 99.5% availability, SOC II, advanced
      governance, AI-driven anomaly detection, data contracts, in-VPC remote execution agent. Pricing
      is quoted via demo request.
    entries:
      - label: Subscription
        name: subscription
        type: subscription
        metric: contract
        limit: see datahub.com
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: 99.5% SLA
      - name: SOC II compliance
      - name: Role-based and attribute-based access controls
      - name: In-VPC Remote Execution Agent
      - name: AI-powered documentation generation
      - name: AI-driven anomaly detection
      - name: Data contract management
      - name: Browser extension for BI tools
      - name: 80+ data source integrations
      - name: Continuous data quality monitors
      - name: Governance automation and certification workflows
      - name: Dedicated customer success team
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
